services:
  streamlit-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlit-ai-portfolio
    ports:
      - "8051:8051"
    volumes:
      - hf-cache:/app/.cache/huggingface
      - sqlite-data:/app
    environment:
      - PYTHONUNBUFFERED=true
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - GROQ_API_KEY=${GROQ_API_KEY}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8051/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  hf-cache:
    driver: local
  sqlite-data:
    driver: local
